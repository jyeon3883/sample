openapi: 3.0.3
info:
  title: Sample API
  version: 1.0.0
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - health
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
